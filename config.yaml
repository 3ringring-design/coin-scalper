mode: paper            # 지금은 모의매매만 (실제 주문 안 나감)

symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
timeframe: 5m          # 5분봉
poll_seconds: 15       # 시세 확인 주기
candles_limit: 500
status_every_minutes: 30

paper:
  starting_cash: 1000  # 가상 시드 (USDT)
  fee_rate: 0.001      # 바이낸스 현물 기본 수수료 0.1%
  slippage_bps: 5      # 체결 미끄러짐 0.05% 가정

risk:
  position_pct: 0.25   # 한 번에 자산의 25%씩 진입
  max_positions: 3     # 동시에 최대 3종목
  min_order_usdt: 10
  cooldown_bars: 3     # 청산 후 3캔들은 같은 종목 재진입 금지

strategy:
  ema_trend: 200
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_entry: 35
  take_profit_pct: 0.010   # +1.0% 익절
  stop_loss_pct: 0.006     # -0.6% 손절
  max_hold_bars: 24        # 최대 2시간 보유 (5분봉 24개)
  mid_exit: true
  mid_exit_min_pct: 0.003  # 중심선 복귀 청산은 +0.3% 이상일 때만
