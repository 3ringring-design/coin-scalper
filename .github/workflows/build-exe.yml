name: Build Windows exe

# main 브랜치에 코드가 올라올 때마다 윈도우 exe를 자동으로 만들어
# 저장소의 Releases > "latest" 에 올립니다.
# 빌드 결과와 로그는 ci-status 브랜치에 기록돼요 (Claude가 확인용으로 읽음).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, test, build
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci
          {
            pip install -r requirements.txt pyinstaller &&
            python -m pytest -q &&
            pyinstaller --onefile --name CoinScalper --collect-all ccxt --add-data "config.yaml;." run.py &&
            pyinstaller --onefile --name Backtest --collect-all ccxt --add-data "config.yaml;." backtest.py &&
            echo "--- built files ---" &&
            ls -la dist
          } 2>&1 | tee ci/build.log

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/CoinScalper.exe, dist/Backtest.exe, config.yaml, .env.example, packaging/README.txt release/
          Compress-Archive -Path release/* -DestinationPath CoinScalper-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: CoinScalper-windows
          path: CoinScalper-windows.zip

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CoinScalper-windows.zip \
            --title "최신 윈도우 실행파일" \
            --notes "main 브랜치 최신 코드로 자동 빌드됐어요. CoinScalper-windows.zip 을 받아서 압축을 풀고 README.txt 를 보세요."

      - name: Report status to ci-status branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci && cd ci
          {
            echo "run_number: ${{ github.run_number }}"
            echo "run_id: ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "build_step: ${{ steps.build.outcome }}"
            echo "job: ${{ job.status }}"
            echo "finished_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status.txt
          git init -q -b ci-status
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "CI #${{ github.run_number }}: ${{ job.status }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-status
